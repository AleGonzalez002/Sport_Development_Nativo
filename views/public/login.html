<!DOCTYPE html>
<!-- Declaración del idioma para el documento -->
<html lang="es">

<head>
    <!-- Título del documento -->
    <title>Iniciar Sesión</title>
    <!-- Metadatos de la página web -->
    <meta charset="utf-8">
    <meta name="author" content="Dennis Gonzalez">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- IMPORTACIÓN DE RECURSOS EXTERNOS -->
    <!-- Llamada al icono de la página web -->
    <link type="image/png" rel="icon" href="../../resources/img/logo.png">
    <!-- Llamada a las hojas de estilos del framework e iconos -->
    <link type="text/css" rel="stylesheet" href="../../resources/css/bootstrap.min.css">
    <link type="text/css" rel="stylesheet" href="../../resources/css/bootstrap-icons.min.css">
</head>

<body>
    <!-- Sección principal centrada -->
    <main class="d-flex justify-content-center align-items-center my-5" style="min-height: 100vh;">
        <div class="container">
            <div class="row justify-content-center">
                <!-- Tarjeta de formulario de inicio de sesión -->
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h4 id="mainTitle"></h4>
                            <img src="../../resources/img/user.png" class="mx-auto d-block" width="100">
                            <!-- Formulario de inicio de sesión -->
                            <form class="row g-3" id="sessionForm">
                                <!-- Correo electrónico -->
                                <div class="col-12">
                                    <label for="correo" class="form-label">Correo electrónico</label>
                                    <input type="email" id="correo" name="correo" class="form-control" required>
                                </div>
                                
                                <!-- Contraseña -->
                                <div class="col-12">
                                    <label for="clave" class="form-label">Contraseña</label>
                                    <input type="password" id="clave" name="clave" class="form-control" required>
                                </div>
                                
                                <!-- Enlace para recuperar la contraseña -->
                                <div class="col-12 text-center">
                                    <a href="recuperar.html" class="text-decoration-none">¿Olvidaste tu contraseña?</a>
                                </div>

                                <!-- Botón de inicio de sesión -->
                                <div class="col-12 text-center">
                                    <button type="submit" class="btn btn-dark px-4 mt-3"><i class="bi bi-lock-fill"></i> Iniciar sesión</button>
                                </div>
                            </form>
                            <!-- Enlace para registrarse -->
                            <div class="text-center p-3">
                                <a href="registrar.html" class="btn btn-outline-dark"><i class="bi bi-person-fill"></i> Crear una cuenta</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- IMPORTACIÓN DE ARCHIVOS JAVASCRIPT -->
    <!-- Llamada al framework y librería de mensajes -->
    <script type="text/javascript" src="../../resources/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="../../resources/js/sweetalert.min.js"></script>
    <!-- Llamada al controlador general de la aplicación -->
    <script type="text/javascript" src="../../controllers/utils/components.js"></script>
    <!-- Llamada al controlador del sitio público -->
    <script type="text/javascript" src="../../controllers/utils/public.js"></script>
    <!-- Llamada al controlador de la página web -->
    <script type="text/javascript" src="../../controllers/public/login.js"></script>
</body>

</html>
